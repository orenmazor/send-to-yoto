name: docker

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # CalVer + short sha, e.g. 2026.08.16-cef487b. Two builds on the same day
      # stay distinct because of the sha.
      - id: tag
        run: echo "value=$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # QEMU is only needed for the arm64 leg. Drop it and the arm64 platform
      # below if you only ever deploy on amd64 — it roughly halves build time.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # 'latest' only moves for the default branch, so a build from any
          # other branch can't hijack it.
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.value }}
            ${{ github.ref == 'refs/heads/main' && format('ghcr.io/{0}:latest', github.repository) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
