version: '3'

# Tasks only exist for commands that aren't obvious. Plain `docker compose`
# covers the rest.
tasks:
  up:
    desc: Build and run the service
    cmds:
      - docker compose up --build

  reauth:
    desc: Forget the saved login, then reconnect in the browser
    cmds:
      # Distroless: no rm, no shell. Python is the only executable in the image.
      # `run --rm` rather than `exec` so this works with the service stopped.
      - >
        docker compose run --rm send-to-yoto -c
        "from pathlib import Path; Path('/config/tokens.json').unlink(missing_ok=True)"
      - echo "reconnect at http://localhost:8080"
